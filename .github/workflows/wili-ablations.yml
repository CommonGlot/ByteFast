name: WiLI ByteFast hash and position ablations
on:
  push:
    branches: ["bytefast/**"]
    paths:
      - ".github/workflows/wili-ablations.yml"
  workflow_dispatch:

jobs:
  ablate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU classifier
        run: make bytefast-proto
      - name: Restore official WiLI archive
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare official WiLI train/test
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili \
            --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 - <<'PY'
          from pathlib import Path
          xs=Path('/tmp/wili/test.fasttext').read_text(encoding='utf-8').splitlines()
          Path('/tmp/wili/test.txt').write_text(''.join(x.split(' ',1)[1]+'\n' for x in xs),encoding='utf-8')
          PY
      - name: Test three feature configurations against single hash
        run: |
          set -euo pipefail
          for cap in 100 500; do
            python3 benchmarks/prepare_budgets.py /tmp/wili/train.fasttext \
              /tmp/wili/train-$cap.txt --per-language "$cap" --seed 1729
            for variant in single bloom2 pos4 bloompos; do
              case "$variant" in
                single) opts="-hashCount 1" ;;
                bloom2) opts="-hashCount 2" ;;
                pos4) opts="-hashCount 1 -positionBins 4" ;;
                bloompos) opts="-hashCount 2 -positionBins 4" ;;
              esac
              echo "::group::ABLATE samples=$cap variant=$variant"
              ./bytefast-proto train /tmp/wili/train-$cap.txt \
                /tmp/wili/model-$cap-$variant.bin \
                -bucket 16384 -dim 32 -epoch 5 -lr 0.3 $opts
              ./bytefast-proto predict /tmp/wili/model-$cap-$variant.bin \
                /tmp/wili/test.txt > /tmp/wili/pred-$cap-$variant.txt
              python3 benchmarks/score_lid.py /tmp/wili/test.fasttext \
                /tmp/wili/pred-$cap-$variant.txt
              /usr/bin/time -f "ABLATE_PERF samples=$cap variant=$variant wall=%e rss_kb=%M" \
                sh -c "./bytefast-proto predict /tmp/wili/model-$cap-$variant.bin /tmp/wili/test.txt >/dev/null"
              stat -c "ABLATE_SIZE %n %s bytes" /tmp/wili/model-$cap-$variant.bin
              echo "::endgroup::"
            done
          done
