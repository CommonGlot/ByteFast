name: ByteFast WiLI domain-shift robustness
on:
  push:
    branches: ["bytefast/**"]
    paths:
      - "benchmarks/prepare_robustness.py"
      - ".github/workflows/bytefast-robustness.yml"
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build fastText and ByteFast
        run: |
          make -j2 opt
          make bytefast
      - name: Cache official WiLI-2018
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare official split and test-only noise
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_robustness.py --workdir /tmp/wili
      - name: Train a better tuned fastText comparison
        run: |
          ./fasttext supervised -input /tmp/wili/train.fasttext -output /tmp/wili/ft-robust -dim 32 -bucket 16384 -epoch 40 -lr 0.3 -minn 2 -maxn 5 -thread 2 -verbose 0
      - name: Train byte classifier
        run: |
          ./bytefast train /tmp/wili/train.fasttext /tmp/wili/byte-robust.bin -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -hashCount 1
      - name: Evaluate real held-out text and robustness variants
        run: |
          set -euo pipefail
          for condition in original short32 short64 short128 oddcase noisy8 webprefix; do
            echo "::group::ROBUSTNESS condition=$condition"
            ./fasttext predict /tmp/wili/ft-robust.bin /tmp/wili/robust-$condition-text.txt > /tmp/wili/ft-$condition.pred
            ./bytefast predict /tmp/wili/byte-robust.bin /tmp/wili/robust-$condition-text.txt > /tmp/wili/bf-$condition.pred
            echo "ROBUSTNESS condition=$condition model=fasttext"
            python3 benchmarks/score_lid.py /tmp/wili/robust-$condition-gold.txt /tmp/wili/ft-$condition.pred | head -n 1
            echo "ROBUSTNESS condition=$condition model=bytefast"
            python3 benchmarks/score_lid.py /tmp/wili/robust-$condition-gold.txt /tmp/wili/bf-$condition.pred | head -n 1
            echo "::endgroup::"
          done
      - name: Model size and inference time
        run: |
          stat -c 'ROBUSTNESS_SIZE %n %s bytes' /tmp/wili/ft-robust.bin /tmp/wili/byte-robust.bin
          for trial in 1 2 3; do
            /usr/bin/time -f "ROBUSTNESS_SPEED fasttext trial=$trial seconds=%e rss_kb=%M" \
              sh -c "./fasttext predict /tmp/wili/ft-robust.bin /tmp/wili/robust-original-text.txt >/dev/null"
            /usr/bin/time -f "ROBUSTNESS_SPEED bytefast trial=$trial seconds=%e rss_kb=%M" \
              sh -c "./bytefast predict /tmp/wili/byte-robust.bin /tmp/wili/robust-original-text.txt >/dev/null"
          done
