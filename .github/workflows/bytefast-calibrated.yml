name: ByteFast learned lexical fusion
on:
  push:
    branches: ["bytefast/calibrated-lexical"]
    paths:
      - "src/bytefast_calibrated.cc"
      - "benchmarks/run_calibrated_lexical.py"
      - "Makefile"
      - ".github/workflows/bytefast-calibrated.yml"
  workflow_dispatch:

jobs:
  learned-lexical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build original fastText and ByteFast CPU binaries
        run: |
          make -j2 opt
          make bytefast bytefast-lexical bytefast-calibrated
      - name: Smoke test learned fusion model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=["__label__hrv Vlak dolazi sljedeći tjedan.",
                 "__label__hrv Ovaj vlak ide iz grada.",
                 "__label__bos Voz polazi sljedeće sedmice.",
                 "__label__bos Novi voz stoji na stanici.",
                 "__label__srp Voz polazi sledeće nedelje.",
                 "__label__srp Železnička stanica ima voz."]
          Path('/tmp/fusion-train.txt').write_text('\n'.join(lines*12)+'\n',encoding='utf8')
          Path('/tmp/fusion-cal.txt').write_text('\n'.join(lines*5)+'\n',encoding='utf8')
          Path('/tmp/fusion-valid.txt').write_text('\n'.join(lines*5)+'\n',encoding='utf8')
          Path('/tmp/fusion-text.txt').write_text(
            'Vlak dolazi iz grada.\nNovi voz na stanici.\n',encoding='utf8')
          PY
          ./bytefast train /tmp/fusion-train.txt /tmp/fusion-base.bin \
            -dim 16 -bucket 2048 -epoch 4 -lr 0.3 -asciiFold 1
          ./bytefast-lexical build /tmp/fusion-base.bin \
            /tmp/fusion-train.txt /tmp/fusion-words.lex 100 1
          ./bytefast-calibrated fit /tmp/fusion-base.bin /tmp/fusion-words.lex \
            /tmp/fusion-cal.txt /tmp/fusion-valid.txt /tmp/fusion-trained.bin
          ./bytefast-calibrated predict /tmp/fusion-base.bin /tmp/fusion-words.lex \
            /tmp/fusion-trained.bin /tmp/fusion-text.txt -gate 0.75 > /tmp/fusion-pred.txt
          test "$(wc -l < /tmp/fusion-pred.txt)" -eq 2
          ./bytefast-calibrated bench /tmp/fusion-base.bin /tmp/fusion-words.lex \
            /tmp/fusion-trained.bin /tmp/fusion-text.txt -gate 0.75
      - name: Reuse official WiLI archive
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare 235-language train and held-out partitions
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili \
            --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_lexical_dev.py --workdir /tmp/wili \
            --train-count 400 --seed 97234
      - name: Fit identical ByteFast encoder to official training partition
        run: |
          ./bytefast train /tmp/wili/lex-train.fasttext /tmp/wili/word-byte.bin \
            -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -asciiFold 1
      - name: Train normal fastText comparator
        run: |
          ./fasttext supervised -input /tmp/wili/lex-train.fasttext \
            -output /tmp/wili/word-fasttext -dim 32 -bucket 16384 \
            -epoch 40 -lr 0.3 -minn 2 -maxn 5 -thread 2 -verbose 0
      - name: Fit weights and choose cutoff and gate from WiLI dev only
        run: |
          python3 benchmarks/run_calibrated_lexical.py
      - name: Export measured results
        uses: actions/upload-artifact@v4
        with:
          name: bytefast-learned-lexical-fusion-results
          path: /tmp/wili/calibrated-lexical-results.json
          retention-days: 30
