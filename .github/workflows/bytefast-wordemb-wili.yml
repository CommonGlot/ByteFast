name: WiLI trained word embeddings versus TF-IDF and confusion selection
on:
  push:
    branches: ["bytefast/trainable-word-branch"]
    paths:
      - "src/bytefast_wordemb.cc"
      - "src/bytefast_lexical.h"
      - "benchmarks/run_wordemb_experiment.py"
      - ".github/workflows/bytefast-wordemb-wili.yml"
  workflow_dispatch:

jobs:
  wili-wordemb:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Compile original fastText, byte classifier, sparse and learned word branches
        run: |
          make -j2 opt
          make bytefast bytefast-lexical bytefast-wordemb
      - name: Reuse official WiLI-2018 archive
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare WiLI train/dev and official held-out test
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili \
            --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_lexical_dev.py \
            --workdir /tmp/wili --train-count 400 --seed 97234
      - name: Train same 235-language byte classifier as earlier study
        run: |
          ./bytefast train /tmp/wili/lex-train.fasttext /tmp/wili/word-byte.bin \
            -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -hashCount 1 -asciiFold 1
      - name: Train compact statistical lexical comparator
        run: |
          ./bytefast-lexical build /tmp/wili/word-byte.bin \
            /tmp/wili/lex-train.fasttext /tmp/wili/word-sparse.lex 200000 3
      - name: Train ordinary 40-epoch fastText control
        run: |
          ./fasttext supervised -input /tmp/wili/lex-train.fasttext \
            -output /tmp/wili/word-fasttext -dim 32 -bucket 16384 \
            -epoch 40 -lr 0.3 -minn 2 -maxn 5 -thread 2 -verbose 0
      - name: Train word vectors and select vocabulary approach on dev only
        run: |
          python3 benchmarks/run_wordemb_experiment.py --workdir /tmp/wili
      - name: Store complete measurements
        uses: actions/upload-artifact@v4
        with:
          name: bytefast-trainable-word-embedding-results
          path: /tmp/wili/wordemb-results.json
          retention-days: 30
