name: ByteFast CPU lexical fast-path gating
on:
  push:
    branches: ["bytefast/lexical-hybrid"]
    paths:
      - "benchmarks/choose_lexical_gate.py"
      - ".github/workflows/bytefast-lexical-gate.yml"
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU classifiers
        run: make bytefast-proto bytefast-lexical
      - uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare WiLI without using test for tuning
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_lexical_dev.py --workdir /tmp/wili --train-count 400 --seed 97234
      - name: Train ByteFast and lexical sidecar
        run: |
          ./bytefast-proto train /tmp/wili/lex-train.fasttext /tmp/wili/lex-byte.bin \
            -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -asciiFold 1
          ./bytefast-lexical build /tmp/wili/lex-byte.bin \
            /tmp/wili/lex-train.fasttext /tmp/wili/lex-gate.bin 200000 3
      - name: Select gate on development split and evaluate official test once
        run: python3 benchmarks/choose_lexical_gate.py
      - name: Serialized model size
        run: |
          stat -c 'GATE_SIZE %n %s' /tmp/wili/lex-byte.bin /tmp/wili/lex-gate.bin
