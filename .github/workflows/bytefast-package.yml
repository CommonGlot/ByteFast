name: ByteFast package and legacy model interoperability
on:
  push:
    branches: ["bytefast/consolidated-package", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  python-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and install ByteFast (not the fasttext distribution)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
      - name: Build original fastText and separate native ByteFast executables
        run: |
          make -j2 opt
          make bytefast bytefast-lexical bytefast-calibrated
      - name: Prepare synthetic three-language classifier training
        run: |
          python - <<'PY'
          from pathlib import Path
          examples={
             "eng":["This is a simple English document with common words.",
                    "The weather is nice and the city is beautiful."],
             "fra":["Bonjour, voici un petit document français.",
                    "Le temps est beau et la ville est magnifique."],
             "spa":["Hola, este es un documento sencillo en español.",
                    "El tiempo es bueno y la ciudad es muy hermosa."],
          }
          train=[
             f"__label__{lang} {lines[i%len(lines)]} Number {i%8}"
             for lang,lines in examples.items() for i in range(60)
          ]
          Path('/tmp/bytefast-train.txt').write_text(
             '\n'.join(train)+'\n', encoding='utf8')
          Path('/tmp/bytefast-inputs.txt').write_text(
             'This is a simple English text.\n'
             'Bonjour le monde magnifique.\n'
             'Hola este es un documento.\n',encoding='utf8')
          PY
      - name: Exercise original fastText Python APIs and both binary readers
        run: |
          python - <<'PY'
          import bytefast
          from pathlib import Path
          model=bytefast.train_fasttext_supervised(
             input='/tmp/bytefast-train.txt',dim=32,epoch=15,lr=0.3,
             minn=2,maxn=5,bucket=4096,thread=1,verbose=0)
          assert len(model.get_labels())==3
          legacy_file='/tmp/original-fasttext.bin'
          model.save_model(legacy_file)
          loaded=bytefast.load_model(legacy_file)
          assert loaded.get_labels()==model.get_labels()
          assert loaded.predict('Bonjour le monde')[0][0].startswith('__label__')
          assert bytefast.legacy.load_model(legacy_file).get_labels()==model.get_labels()
          # Quantized original fastText files use the same legacy reader.
          model.quantize(qout=False, retrain=False, dsub=2)
          model.save_model('/tmp/original-fasttext.ftz')
          quantized=bytefast.load_model('/tmp/original-fasttext.ftz')
          assert len(quantized.get_labels())==3
          assert quantized.predict('Bonjour le monde')[0]

          model=bytefast.train_supervised(
             '/tmp/bytefast-train.txt',output='/tmp/native-bytefast.bin',
             dim=32,bucket=4096,epoch=10,lr=0.3,ascii_fold=True)
          assert model.model_type=='bytefast'
          assert len(model.predict('Hello beautiful world.',k=2)[0])==2
          assert len(model.predict(['hello world','bonjour ici']))==2
          again=bytefast.load_model('/tmp/native-bytefast.bin')
          assert again.model_type=='bytefast'
          assert again.get_labels()==model.get_labels()
          assert again.predict('hello world')[0][0].startswith('__label__')
          try:
              bytefast.load_model('/tmp/invalid.bin')
              raise AssertionError('invalid model unexpectedly loaded')
          except FileNotFoundError:
              pass
          print('BYTEFAST_AND_LEGACY_MODEL_LOADING_PASS')
          PY
      - name: Build portable learned lexical model and verify single-file bundle
        run: |
          ./bytefast-lexical build /tmp/native-bytefast.bin \
            /tmp/bytefast-train.txt /tmp/native-words.lex 1000 1
          ./bytefast-calibrated fit /tmp/native-bytefast.bin /tmp/native-words.lex \
            /tmp/bytefast-train.txt /tmp/bytefast-train.txt /tmp/native-fusion.fuse
          python - <<'PY'
          import bytefast
          import struct
          import pathlib

          base='/tmp/native-bytefast.bin'
          words='/tmp/native-words.lex'
          fusion='/tmp/native-fusion.fuse'
          output='/tmp/bytefast-complete.bin'
          bytefast.bundle_model(base,words,fusion,output)
          assert pathlib.Path(output).read_bytes()[:4]==b'BFBN'
          separate=bytefast.load_model(base,lexicon=words,fusion=fusion)
          combined=bytefast.load_model(output)
          assert combined.model_type=='bytefast-calibrated'
          assert separate.get_labels()==combined.get_labels()
          for query in ['hello world','bonjour le monde','hola amigos']:
              expected=separate.predict(query,k=2)
              actual=combined.predict(query,k=2)
              assert expected[0]==actual[0],(expected,actual)
          try:
              bytefast.load_model('/tmp/original-fasttext.bin',
                                  lexicon=words,fusion=fusion)
              raise AssertionError('legacy should reject ByteFast sidecars')
          except ValueError:
              pass
          print('BYTEFAST_SINGLE_FILE_BUNDLE_PASS')
          PY
      - name: Train a generic text classifier with arbitrary class names
        run: |
          python - <<'PY'
          import bytefast
          from pathlib import Path
          categories = {
              'sports': ['The player scored a goal in the match.',
                         'The tournament ended with a championship.'],
              'finance': ['The company published its quarterly earnings.',
                          'Investors reviewed the stock market report.'],
              'technology': ['The processor has a new chip architecture.',
                             'Developers fixed the software release issue.'],
          }
          samples = [
              '__label__{} {} Article {}'.format(label, examples[i % len(examples)], i)
              for label, examples in categories.items()
              for i in range(40)
          ]
          Path('/tmp/generic-classification.txt').write_text(
              '\\n'.join(samples) + '\\n', encoding='utf-8')
          model = bytefast.train_supervised(
              '/tmp/generic-classification.txt',
              output='/tmp/generic-classification.bin',
              dim=16, bucket=4096, epoch=6, lr=0.2)
          expected = {'__label__sports', '__label__finance',
                      '__label__technology'}
          assert set(model.get_labels()) == expected
          reloaded = bytefast.load_model('/tmp/generic-classification.bin')
          assert set(reloaded.get_labels()) == expected
          prediction, probabilities = reloaded.predict(
              'The tournament player scored', k=2)
          assert len(prediction) == len(probabilities) == 2
          assert all(label in expected for label in prediction)
          print('BYTEFAST_GENERIC_CLASSIFICATION_PASS')
          PY
      - name: Confirm that public original fasttext Python package can coexist
        run: |
          python -m pip install 'fasttext==0.9.3'
          python - <<'PY'
          import fasttext
          import bytefast
          assert fasttext.__name__ == 'fasttext'
          assert bytefast.__name__ == 'bytefast'
          assert fasttext.train_supervised is not bytefast.train_supervised
          assert len(bytefast.load_model('/tmp/original-fasttext.bin').get_labels())==3
          assert len(bytefast.load_model('/tmp/bytefast-complete.bin').get_labels())==3
          print('BYTEFAST_COEXISTS_WITH_FASTTEXT_PASS')
          PY
