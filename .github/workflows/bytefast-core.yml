name: ByteFast core text features
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests for folding and text n-gram hashing
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc tests/textnorm_test.cc -o /tmp/textnorm_test
          /tmp/textnorm_test
      - name: Check the generated Unicode tables are current
        run: |
          python3 tools/gen_unicode_fold.py > /tmp/unicode_fold.h
          python3 tools/gen_strip_table.py > /tmp/strip_table.h
          python3 - <<'PY'
          import unicodedata
          from pathlib import Path
          for name in ["unicode_fold.h", "strip_table.h"]:
              committed = Path("src", name).read_text()
              version = committed.splitlines()[0].split("Unicode ")[1].split(";")[0]
              if version == unicodedata.unidata_version:
                  assert committed == Path("/tmp", name).read_text(), name
                  print(name, "matches Unicode", version)
              else:
                  print("runner has Unicode", unicodedata.unidata_version,
                        "; %s was generated from" % name, version, "- not compared")
          PY
      - name: Build the bytefast CLI
        run: make -j2 opt
      - name: Train, test and reload every feature family
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import random
          random.seed(0)
          words = {
              "alpha": "river stone mountain forest valley meadow".split(),
              "beta": "engine piston turbine valve gear shaft".split(),
              "gamma": "violin piano cello flute trumpet harp".split(),
          }
          def rows(n):
              for label, vocab in words.items():
                  for _ in range(n):
                      yield "__label__%s %s" % (label, " ".join(random.choices(vocab, k=6)))
          Path("/tmp/core-train.txt").write_text("\n".join(rows(200)) + "\n")
          Path("/tmp/core-test.txt").write_text("\n".join(rows(30)) + "\n")
          Path("/tmp/core-lexicon.tsv").write_text(
              "".join("%s\t%s\n" % (l, w) for l, vocab in words.items() for w in vocab))
          PY
          set -e
          for cfg in "-minn 2 -maxn 5" "-minb 2 -maxb 5 -minCount 1000000000 -bucket 100000" \
                     "-minb 2 -maxb 5 -bucket 100000 -lexicon /tmp/core-lexicon.tsv" \
                     "-minb 2 -maxb 5 -maxBytes 64 -bucket 100000"; do
            ./bytefast supervised -input /tmp/core-train.txt -output /tmp/core -dim 16 -epoch 10 -lr 0.5 -thread 2 -verbose 0 $cfg
            ./bytefast test /tmp/core.safetensors /tmp/core-test.txt | tee /tmp/core-result.txt
            python3 -c "import sys; p=float(open('/tmp/core-result.txt').read().split()[3]); print('cfg=$cfg P@1=%s' % p); sys.exit(p < 0.95)"
          done
          python3 -c "d=open('/tmp/core.safetensors','rb').read(9); assert d[8:9]==b'{', d"
      - name: Presets, label weights and experts
        run: |
          set -e
          printf "alpha\t0.5\n__label__gamma\t2\n" > /tmp/core-weights.tsv
          ./bytefast supervised -input /tmp/core-train.txt -output /tmp/preset -preset lid -minCount 1 \
            -bucket 100000 -epoch 10 -lr 0.5 -thread 2 -verbose 0 -labelWeights /tmp/core-weights.tsv
          ./bytefast test /tmp/preset.safetensors /tmp/core-test.txt
          grep -v __label__alpha /tmp/core-train.txt > /tmp/core-expert.txt
          ./bytefast supervised -input /tmp/core-expert.txt -output /tmp/expert -minb 2 -maxb 5 \
            -bucket 100000 -dim 16 -epoch 10 -lr 0.5 -thread 2 -verbose 0
          ./bytefast add-expert /tmp/preset.safetensors /tmp/expert.safetensors /tmp/experts.safetensors 0.9
          ./bytefast test /tmp/experts.safetensors /tmp/core-test.txt | tee /tmp/expert-result.txt
          python3 -c "import sys; p=float(open('/tmp/expert-result.txt').read().split()[3]); sys.exit(p < 0.95)"
      - name: C API
        run: |
          make -j2 c_api_test
          ./c_api_test /tmp/core.safetensors "violin piano cello harp" __label__gamma
      - name: Rust crate
        run: |
          BYTEFAST_TEST_MODEL=/tmp/core.safetensors BYTEFAST_TEST_TEXT="violin piano cello harp" \
            BYTEFAST_TEST_LABEL=__label__gamma cargo test --release
          cargo package --allow-dirty
      - uses: mymindstorm/setup-emsdk@v14
      - name: JavaScript package (WebAssembly)
        run: |
          make wasm
          node bindings/js/test.mjs /tmp/core.safetensors "violin piano cello harp" __label__gamma
          cd bindings/js && npm pack --dry-run
      - name: Training on character spans, normalized and stripped lines
        run: |
          set -e
          ./bytefast supervised -input /tmp/core-train.txt -output /tmp/augmented -minb 2 -maxb 5 -bucket 100000 \
            -dim 16 -epoch 5 -lr 0.5 -thread 2 -verbose 0 -cropProb 0.5 -cropMin 3 -cropMax 20 \
            -normProb 0.3 -stripProb 0.3 -lexicon /tmp/core-lexicon.tsv
          ./bytefast test /tmp/augmented.safetensors /tmp/core-test.txt
      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Python text-feature regression
        run: python tests/test_python_text_features.py
      - name: Model files are valid safetensors
        run: |
          python -m pip install safetensors
          python - <<'PY'
          from safetensors import safe_open
          for path in ["/tmp/core.safetensors", "/tmp/augmented.safetensors", "/tmp/experts.safetensors"]:
              with safe_open(path, "np") as f:
                  meta = f.metadata()
                  assert meta["format"] == "bytefast", meta
                  shapes = {k: f.get_tensor(k).shape for k in f.keys()}
                  assert "output" in shapes and "vocab.strings" in shapes, shapes
                  assert path != "/tmp/augmented.safetensors" or "lexicon.bloom" in shapes, shapes
                  print(path, shapes)
          PY
