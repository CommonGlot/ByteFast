name: ByteFast byte feature tests
on:
  push:
    branches: ["bytefast/**", "main"]
  pull_request:

jobs:
  byte-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone byte features test
        run: c++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc/proto tests/byte_ngrams_test.cc -o /tmp/bytefast-test
      - name: Test byte feature invariants
        run: /tmp/bytefast-test
      - name: Compile byte extraction microbenchmark
        run: c++ -std=c++17 -O3 -Wall -Wextra -Isrc/proto benchmarks/byte_ngrams_bench.cc -o /tmp/bytefast-bench
      - name: Run byte extraction microbenchmark
        run: /tmp/bytefast-bench
