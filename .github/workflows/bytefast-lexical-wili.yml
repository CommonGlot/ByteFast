name: WiLI lexical sidecar and BCMS comparison
on:
  push:
    branches: ["bytefast/lexical-hybrid"]
    paths:
      - "benchmarks/run_lexical_experiment.py"
      - "benchmarks/prepare_lexical_dev.py"
      - "src/proto/bytefast_lexical.cc"
      - ".github/workflows/bytefast-lexical-wili.yml"
  workflow_dispatch:
jobs:
  lexical-wili:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build native classifiers
        run: |
          make -j2 opt
          make bytefast-proto bytefast-lexical
      - name: Restore official WiLI archive
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare official train/dev/test partitions
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili \
            --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_lexical_dev.py --workdir /tmp/wili \
            --train-count 400 --seed 97234
      - name: Train compact ByteFast on train partition only
        run: |
          ./bytefast-proto train /tmp/wili/lex-train.fasttext /tmp/wili/lex-byte.bin \
            -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -asciiFold 1
      - name: Train 40-epoch fastText control on identical train partition
        run: |
          ./bytefast supervised -input /tmp/wili/lex-train.fasttext \
            -output /tmp/wili/lex-fasttext -dim 32 -bucket 16384 \
            -epoch 40 -lr 0.3 -minn 2 -maxn 5 -thread 2 -verbose 0
      - name: Select lexical configuration on development data, test once
        run: |
          python3 benchmarks/run_lexical_experiment.py --workdir /tmp/wili
      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: bytefast-lexical-wili-report
          path: /tmp/wili/lexical-results.json
          retention-days: 30
