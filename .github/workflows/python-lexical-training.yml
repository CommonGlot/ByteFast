name: ByteFast Python lexical training API
on:
  push:
    branches: ["feature/python-lexical-training", "main"]
    paths:
      - "python/fasttext_module/fasttext/api.py"
      - "python/fasttext_module/fasttext/pybind/bytefast_pybind.cc"
      - "src/bytefast_calibrated.h"
      - "src/bytefast_lexical.h"
      - "tests/test_python_lexical_training.py"
      - ".github/workflows/python-lexical-training.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  python-lexical-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build ByteFast Python extensions
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
      - name: Train byte-only and calibrated lexical classifiers through Python API
        run: |
          python tests/test_python_lexical_training.py
