name: WiLI word embedding dimensionality sweep 16–512
on:
  push:
    branches: ["bytefast/trainable-word-branch"]
    paths:
      - "src/proto/bytefast_wordemb.cc"
      - "benchmarks/run_wordemb_widths.py"
      - ".github/workflows/bytefast-wordemb-widths.yml"
  workflow_dispatch:

jobs:
  embedding-widths:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Host CPU
        run: |
          lscpu | grep -E 'Model name|Architecture|CPU\(s\)'
      - name: Build byte, word and ordinary fastText classifiers
        run: |
          make -j2 opt
          make bytefast-proto bytefast-lexical bytefast-wordemb
      - name: Cache official WiLI-2018 archive
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare official WiLI train, development and test
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili \
            --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_lexical_dev.py --workdir /tmp/wili \
            --train-count 400 --seed 97234
      - name: Train same byte baseline for every word vector width
        run: |
          ./bytefast-proto train /tmp/wili/lex-train.fasttext /tmp/wili/word-byte.bin \
            -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -asciiFold 1
      - name: Construct existing statistical lexical comparator
        run: |
          ./bytefast-lexical build /tmp/wili/word-byte.bin \
            /tmp/wili/lex-train.fasttext /tmp/wili/word-sparse.lex 200000 3
      - name: Train ordinary 40-epoch fastText comparator
        run: |
          ./bytefast supervised -input /tmp/wili/lex-train.fasttext \
            -output /tmp/wili/word-fasttext -dim 32 -bucket 16384 \
            -epoch 40 -lr 0.3 -minn 2 -maxn 5 -thread 2 -verbose 0
      - name: Train 16 32 64 128 256 512 dimensions and select on development split
        run: |
          python3 benchmarks/run_wordemb_widths.py \
            --workdir /tmp/wili --epochs 18 --vocab 40000 --learning-rate 0.035
      - name: Save evaluated results
        uses: actions/upload-artifact@v4
        with:
          name: bytefast-16-to-512-word-dimension-sweep
          path: /tmp/wili/wordemb-width-results.json
          retention-days: 30
