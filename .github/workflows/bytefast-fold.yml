name: ByteFast case-folding ablation
on:
  push:
    branches: ["bytefast/**"]
    paths:
      - ".github/workflows/bytefast-fold.yml"
  workflow_dispatch:

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU classifier
        run: make bytefast
      - name: Cache WiLI archive
        uses: actions/cache@v4
        with:
          path: /tmp/wili/wili-2018.zip
          key: wili2018-original-zenodo-v1
      - name: Prepare official WiLI data and held-out stress tests
        run: |
          python3 benchmarks/prepare_wili.py --workdir /tmp/wili --train-per-language 500 --test-per-language 50 --max-bytes 512
          python3 benchmarks/prepare_robustness.py --workdir /tmp/wili
      - name: Train byte hashing variants with identical hyperparameters
        run: |
          for flag in 0 1; do
            ./bytefast train /tmp/wili/train.fasttext /tmp/wili/byte-fold-$flag.bin \
              -dim 32 -bucket 16384 -epoch 10 -lr 0.3 -hashCount 1 -asciiFold "$flag"
          done
      - name: Compare quality on seven test conditions
        run: |
          set -euo pipefail
          for condition in original short32 short64 short128 oddcase noisy8 webprefix; do
            for flag in 0 1; do
              echo "FOLD condition=$condition fold=$flag"
              ./bytefast predict /tmp/wili/byte-fold-$flag.bin /tmp/wili/robust-$condition-text.txt > /tmp/wili/fold-$flag-$condition.pred
              python3 benchmarks/score_lid.py /tmp/wili/robust-$condition-gold.txt /tmp/wili/fold-$flag-$condition.pred | head -n1
            done
          done
      - name: Compare inference speed and model size
        run: |
          for flag in 0 1; do
            stat -c "FOLD_SIZE flag=$flag bytes=%s" /tmp/wili/byte-fold-$flag.bin
            for trial in 1 2 3; do
              /usr/bin/time -f "FOLD_SPEED flag=$flag trial=$trial seconds=%e rss_kb=%M" \
                sh -c "./bytefast predict /tmp/wili/byte-fold-$flag.bin /tmp/wili/robust-original-text.txt >/dev/null"
            done
          done
